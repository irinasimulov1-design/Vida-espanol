name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:
  # Svako jutro novi build, da se postovi zakazani za taj dan (date u budućnosti) pojave sami.
  schedule:
    - cron: "0 5 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Posle deploya javlja Bing-u (i ostalim IndexNow pretraživačima) sve URL-ove iz sitemape,
  # da novi tekstovi budu indeksirani za par minuta. Neuspeh ovde ne obara deploy.
  indexnow:
    runs-on: ubuntu-latest
    needs: deploy
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Ping IndexNow
        run: |
          HOST=$(cat public/CNAME)
          KEY=$(grep -o 'indexNowKey: "[a-f0-9]*"' src/lib/site.ts | cut -d'"' -f2)
          URLS=$(curl -fsSL "https://$HOST/sitemap.xml" | grep -o '<loc>[^<]*' | sed 's/<loc>//' | jq -R . | jq -sc .)
          jq -n --arg host "$HOST" --arg key "$KEY" --argjson urls "$URLS" \
            '{host: $host, key: $key, keyLocation: "https://\($host)/\($key).txt", urlList: $urls}' \
            | curl -sS -X POST "https://api.indexnow.org/indexnow" \
                -H "Content-Type: application/json; charset=utf-8" -d @- -w "IndexNow status: %{http_code}\n"
